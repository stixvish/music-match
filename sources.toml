# Which folders to scan, and how to treat them.
# Folders are matched by NAME, not absolute path, so the library can move.

[sources.yt-dlp]
path = "~/Music/yt-dlp"
check_for_video_rips = true

[sources.beatport]
path = "~/Music/beatport"
check_for_video_rips = false

# Where the lower-quality copy of a duplicate goes. Audio files are never
# deleted outright, so dedup moves the loser here instead. Keep this
# OUTSIDE the source folders above, or the next scan will index it again.
[duplicates]
path = "~/Music/_low-quality-duplicates"

# Where files awaiting a human decision are moved. Suspected video rips
# go to a `possible-video-rip` folder under this. Keep it OUTSIDE the
# source folders above, for the same reason as [duplicates].
[review]
path = "~/Music/_review"
