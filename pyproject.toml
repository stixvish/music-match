[project]
name = "music"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "yt-dlp",
  "mutagen",
  "pydantic>=2",
  "httpx",
  "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
music = "music.cli:main"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]
# essentia-tensorflow is heavy (~120 MB) and only needed for classify.
classify = ["essentia-tensorflow"]

[tool.hatch.build.targets.wheel]
packages = ["src/music"]
# schema.sql must ship inside the wheel, not just the source tree
artifacts = ["src/music/db/schema.sql"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- style: google python style guide, 2-space indent (deliberate deviation) ---
[tool.ruff]
indent-width = 2
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "PTH"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ARG"]

[tool.ruff.format]
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

# third-party packages without type stubs
[[tool.mypy.overrides]]
# numpy arrives via the optional `classify` group, which ci does not sync;
# essentia and yt-dlp ship no stubs.
module = ["yt_dlp.*", "mutagen.*", "essentia.*", "numpy.*"]
ignore_missing_imports = true

# pure modules are held to a stricter bar; see SPEC.md §19
[[tool.mypy.overrides]]
module = ["music.normalise", "music.arbitrate", "music.identify", "music.publish.naming"]
disallow_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits real networks/models. excluded from ci (SPEC.md §19)",
  "slow: seconds, not milliseconds",
]

[tool.coverage.report]
# hard gate applies to pure modules only; see SPEC.md §19.
# each is added here as it is built (tasks/todo.md t8, t11, t24, t26).
include = [
  "src/music/normalise.py",
  "src/music/identify.py",
  "src/music/publish/naming.py",
]
fail_under = 90
