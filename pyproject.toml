[project]
name = "music-match"
version = "0.1.0"
description = "automatic metadata tagging for a personal music library"
readme = "README.md"
authors = [
    { name = "Vishesh Gupta", email = "64042847+stixvish@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
  "typer>=0.12",
  "nicegui>=1.4",  # built on FastAPI/uvicorn internally; do not also
                   # hand-pin fastapi/uvicorn here, it will fight NiceGUI
                   # over which version it wants
  "mutagen>=1.47",
  "yt-dlp>=2024.8",
  "pyacoustid>=1.3",
  "musicbrainzngs>=0.7",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "pillow>=10.4",
]

[project.scripts]
music-match = "music_match.cli.main:app"

[dependency-groups]
dev = [
  "yapf>=0.40",
  "pylint>=3.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pre-commit>=3.8",
  "types-requests",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: hits real network APIs; excluded from the commit gate",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
untyped_calls_exclude = ["mutagen"]

[[tool.mypy.overrides]]
module = ["acoustid.*", "musicbrainzngs.*", "yt_dlp.*", "essentia.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "music_match.tagging.*"
warn_unreachable = false
