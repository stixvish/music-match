<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music — review</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<nav id="modes" aria-label="Mode">
  <button class="mode" data-mode="review" aria-pressed="true">Review</button>
  <button class="mode" data-mode="elicit" aria-pressed="false">Calibrate</button>
</nav>

<div id="app">
  <!-- wayfinding: every pane says where you are and what is here -->
  <section class="pane" id="queue-pane">
    <header class="chrome">
      <h2>Review queue</h2>
      <span class="label" id="queue-count"></span>
    </header>
    <!-- acquisition lives here, where tracks arrive. the link box further down
         the track pane overrides *identity*; these are not the same thing and
         one used to be mistaken for the other. -->
    <form id="add" autocomplete="off">
      <textarea id="add-url" rows="1" spellcheck="false"
        placeholder="Paste one or more YouTube links, one per line…"></textarea>
      <button type="submit" id="add-go">Add</button>
    </form>
    <div id="add-status"></div>
    <input id="search" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search artist, title, album, label…"
           aria-label="Search the library">
    <div id="queue"></div>
  </section>

  <section class="pane" id="track-pane">
    <header class="chrome">
      <h1 id="track-title">Nothing selected</h1>
      <span class="label" id="track-meta"></span>
    </header>
    <!-- the console needs the width; the queue column is 19rem -->
    <section id="console" hidden>
      <button id="console-toggle" aria-expanded="true"
              aria-controls="log">Hide output</button>
      <div id="counters"></div>
      <pre id="log" role="log" aria-live="polite" aria-label="Pipeline output"></pre>
    </section>
    <div id="track"></div>
  </section>

  <section class="pane" id="side-pane">
    <header class="chrome">
      <h2 id="side-title">Sources</h2>
      <span class="label" id="side-field"></span>
    </header>
    <div id="side"></div>
  </section>
</div>
<section id="elicit" hidden>
  <header class="chrome elicit-chrome">
    <h2 id="elicit-field">Calibrate</h2>
    <span class="label" id="elicit-progress"></span>
  </header>
  <div id="elicit-body"></div>
</section>

<script src="/app.js" type="module"></script>
</body>
</html>
