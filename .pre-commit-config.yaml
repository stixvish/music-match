# Git-native quality gate. Runs on every commit from any source:
# Claude Code, the terminal, or VS Code's git panel.
#
# Scope is deliberately explicit (src/ tests/) on every hook here, not
# "whatever's staged" — pylint in particular must lint the same scope in
# every layer (this file, the Claude Code hook, and CI) or you get
# different pass/fail results depending on which one ran.
repos:
  - repo: local
    hooks:
      - id: commit-msg-format
        name: commit message format (short, lowercase, no body)
        entry: .claude/hooks/commit-msg-check.sh
        language: system
        stages: [commit-msg]

      - id: yapf
        name: yapf (google style, 2-space)
        entry: uv run yapf -d -r src/ tests/
        language: system
        types: [python]
        pass_filenames: false

      - id: pylint
        name: pylint (google config)
        entry: uv run pylint src/ tests/
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-unit
        name: pytest (fast unit tests)
        entry: uv run pytest tests/unit/ -q
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
