name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check formatting
        run: uv run yapf -d -r src/ tests/

      - name: Lint
        run: uv run pylint src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit/ -q

      - name: Integration tests
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          MUSICBRAINZ_USER_AGENT: music-match-ci/0.1.0 ( ci@example.com )
        # Exit code 5 is "no tests collected". The integration suite is
        # empty until the first source module lands; an empty suite is
        # not a failure, but any real failure still is.
        run: |
          code=0
          uv run pytest tests/integration/ -q || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi
