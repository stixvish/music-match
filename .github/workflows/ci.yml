name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The integration tests exist to catch a source changing its response
  # shape underneath us. That does not happen on our schedule, so it is
  # worth checking without waiting for someone to open a PR.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check formatting
        run: uv run yapf -d -r src/ tests/

      - name: Lint
        run: uv run pylint src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit/ -q

      - name: Integration tests
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          MUSICBRAINZ_USER_AGENT: >-
            music-match-ci/0.1.0 (
            +https://github.com/stixvish/music-match )
        # Exit code 5 is "no tests collected", which is not a failure —
        # every test here skips itself when its source's credentials are
        # absent, so a fork without secrets collects nothing to run. Any
        # real failure still fails the job.
        run: |
          code=0
          uv run pytest tests/integration/ -q || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi
